plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videoprep'
version = '0.1.0'

android {
  namespace "expo.modules.videoprep"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // та же версия Media3, что у expo-video (node_modules/expo-video/android/build.gradle) — иначе Gradle поднимет
  // общую до большей и плеер может сломаться
  def media3 = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3}"
  implementation "androidx.media3:media3-effect:${media3}"
  implementation "androidx.media3:media3-common:${media3}"
}
