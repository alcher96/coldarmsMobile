plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videoprep'
version = '0.1.0'

android {
  namespace "expo.modules.videoprep"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // правила для релизной сборки приложения (R8): MediaPipe — без переименования (см. proguard-rules.pro)
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // та же версия Media3, что у expo-video (node_modules/expo-video/android/build.gradle) — иначе Gradle поднимет
  // общую до большей и плеер может сломаться
  def media3 = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3}"
  implementation "androidx.media3:media3-effect:${media3}"
  implementation "androidx.media3:media3-common:${media3}"
  // «скан» людей на замершем кадре вступления (PeopleScanner): детектор + Magic Touch v2 по штриху + запасной сегментатор
  // людей. 1.2.0: в 0.10.35 старый Magic Touch на Android не учитывал отметку (одна маска на всех людей кадра)
  implementation "com.google.mediapipe:tasks-vision:1.2.0"
}
